name: Validate PR

on:
  pull_request:
  push:
    branches:
      - codex/investor-recall-25k-path

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate applied answer architecture
        run: node scripts/validate_applied_answer_architecture.js

      - name: Validate Part 1 source cards
        run: node scripts/validate_part1_two_vertical_source_cards.js

      - name: Validate answer-first legal RAG API
        run: node scripts/validate_legal_rag_answer_first_api.js

      - name: Validate tree grounding contract
        run: node scripts/validate_tree_grounding_contract.js

      - name: Validate anti-hallucination contract
        run: node scripts/validate_anti_hallucination_contract.js

      - name: Regenerate PR 6 demo outputs
        run: node scripts/generate_pr6_demo_outputs.js

      - name: Validate PR 6 demo assets
        run: node scripts/validate_pr6_demo_assets.js

      - name: Ensure PR 6 demo outputs are committed
        run: git diff --exit-code artifacts/demo_outputs

      - name: Build L1-L3.5 case corpus sample
        run: node scripts/build_case_corpus_l1_l35_sample.js

      - name: Repair L3 principle quality
        run: node scripts/repair_principle_quality.js

      - name: Validate L1 case registry
        run: node scripts/validate_case_registry_10000.js --sample

      - name: Validate L2 paragraph proof
        run: node scripts/validate_hklii_paragraph_accuracy.js --full

      - name: Validate L3 proposition cards
        run: node scripts/validate_proposition_cards.js --sample

      - name: Validate L3 principle cards
        run: node scripts/validate_principle_cards.js --sample

      - name: Validate L3.5 case digest cards
        run: node scripts/validate_case_digest_cards.js --sample

      - name: Build L1-L3.5 case corpus chunks
        run: node scripts/build_case_corpus_chunks.js --sample

      - name: Dry-run L1-L3.5 case corpus embeddings
        run: node scripts/embed_case_corpus_chunks.js --dry-run --sample --no-network

      - name: Dry-run L1-L3.5 case corpus Qdrant indexer
        run: node scripts/index_case_corpus_qdrant.js --dry-run --sample --no-network

      - name: Evaluate L1-L3.5 case corpus retrieval
        run: node scripts/evaluate_case_corpus_retrieval.js --sample

      - name: Run L1-L3.5 ingest pipeline status
        run: node scripts/run_case_corpus_ingest_pipeline.js --sample --no-network --dry-run

      - name: Build sample candidate extractions
        run: node scripts/build_sample_candidate_extractions.js --limit 40

      - name: Run candidate-to-L3.5 fast-growth batch
        run: node scripts/run_candidate_to_l35_batch.js --dry-run --build-cards

      - name: Validate candidate extraction verification
        run: node scripts/validate_candidate_extraction_verification.js

      - name: Audit L1-L3.5 case corpus quality
        run: node scripts/audit_case_corpus_quality_sample.js

      - name: Report L1-L3.5 issue coverage
        run: node scripts/report_case_corpus_issue_coverage.js

      - name: Validate L1-L3.5 status dashboard
        run: node scripts/validate_case_corpus_l1_l35_status.js

      - name: Generate L1-L3.5 demo outputs
        run: node scripts/generate_case_corpus_l35_demo_outputs.js

      - name: Validate L1-L3.5 demo outputs
        run: node scripts/validate_case_corpus_l35_demo_outputs.js

      - name: Build PR 6 demo freeze package
        run: node scripts/build_demo_freeze_package_pr6.js

      - name: Build viewer case evidence index
        run: node scripts/build_viewer_case_evidence_index.js

      - name: Build viewer case authority registry
        run: node scripts/build_case_authority_registry.js

      - name: Validate PR 6 demo readiness
        run: node scripts/validate_demo_readiness_pr6.js

      - name: Validate public demo source links
        run: node scripts/validate_public_demo_source_links.js

      - name: Build excluded unverified seed report
        run: node scripts/build_excluded_unverified_case_seeds_report.js

      - name: Run verified case authority pipeline
        run: node scripts/run_case_authority_pipeline.js

      - name: Validate verified case authority registry
        run: node scripts/validate_verified_case_authority.js

      - name: Validate all visible cases are resolved or excluded
        run: node scripts/validate_all_visible_cases_resolved_or_excluded.js

      - name: Validate no visible unverified case authorities
        run: node scripts/validate_no_visible_unverified_case_authorities.js

      - name: Validate backend case search uses verified only
        run: node scripts/validate_backend_case_search_uses_verified_only.js

      - name: Evaluate case recall Level 1
        run: node scripts/evaluate_case_recall_level1.js

      - name: Evaluate AI Inquiry Level 2
        run: node scripts/evaluate_ai_inquiry_level2.js

      - name: Build law-tree case fruit packs
        run: node scripts/build_law_tree_case_fruit_packs.js

      - name: Validate law-tree case fruit packs
        run: node scripts/validate_law_tree_case_fruit_packs.js

      - name: Evaluate law-tree case fruit Level 1
        run: node scripts/evaluate_law_tree_case_fruit_level1.js

      - name: Evaluate law-tree case fruit Level 2
        run: node scripts/evaluate_law_tree_case_fruit_level2.js

      - name: Generate case authority final report
        run: node scripts/generate_case_authority_final_report.js

      - name: Validate no visible pending verification
        run: node scripts/validate_no_visible_pending_verification.js

      - name: Validate viewer seed source proof
        run: node scripts/validate_viewer_seed_source_proof.js

      - name: Smoke test viewer UI quality
        run: node scripts/smoke_test_viewer_ui_quality.js

      - name: Smoke test PR 6 demo API
        run: node scripts/smoke_test_pr6_demo_api.js --local-only --skip-network

      - name: Smoke test public Vercel demo
        if: ${{ vars.PUBLIC_DEMO_URL != '' }}
        env:
          PUBLIC_DEMO_URL: ${{ vars.PUBLIC_DEMO_URL }}
        run: node scripts/smoke_test_public_vercel_demo.js

      - name: Ensure PR 6 demo freeze artifacts are committed
        run: git diff --exit-code artifacts/demo_freeze_report.json artifacts/demo_freeze_report.md artifacts/demo_outputs/demo_query_pack.json artifacts/demo_outputs/demo_query_pack.md artifacts/ui_demo_quality_check.md artifacts/excluded_unverified_case_seeds_report.json artifacts/excluded_unverified_case_seeds_report.md artifacts/all_visible_case_seed_inventory.json artifacts/all_visible_case_seed_inventory.md artifacts/visible_case_source_resolution_report.json artifacts/visible_case_source_resolution_report.md artifacts/case_recall_level1_eval.json artifacts/case_recall_level1_eval.md artifacts/ai_inquiry_level2_eval.json artifacts/ai_inquiry_level2_eval.md artifacts/law_tree_case_fruit_pack_report.json artifacts/law_tree_case_fruit_pack_report.md artifacts/law_tree_case_fruit_level1_eval.json artifacts/law_tree_case_fruit_level1_eval.md artifacts/law_tree_case_fruit_level2_eval.json artifacts/law_tree_case_fruit_level2_eval.md artifacts/case_authority_final_report.json artifacts/case_authority_final_report.md docs/boss_demo_script_pr6.md

      - name: Ensure L1-L3.5 artifacts are committed
        run: git diff --exit-code data/legal_ingest/case_corpus data/legal_ingest/case_authority_registry.json artifacts/case_corpus_l1_l35_status.json artifacts/case_corpus_l1_l35_status.md artifacts/case_corpus_ingest_run_status.json artifacts/case_corpus_ingest_run_status.md artifacts/case_corpus_embedding_dry_run.json artifacts/case_corpus_qdrant_dry_run.json artifacts/case_corpus_retrieval_eval.json artifacts/case_corpus_retrieval_eval.md artifacts/case_corpus_duplicates_report.json artifacts/candidate_extraction_verification_report.json artifacts/candidate_extraction_verification_report.md artifacts/candidate_verified_cards_report.json artifacts/candidate_verified_cards_report.md artifacts/case_corpus_quality_audit.json artifacts/case_corpus_quality_audit.md artifacts/case_corpus_issue_coverage.json artifacts/case_corpus_issue_coverage.md artifacts/principle_quality_repair_report.json artifacts/principle_quality_repair_report.md artifacts/weak_issue_target_discovery_report.json artifacts/weak_issue_target_discovery_report.md artifacts/law_tree_case_fruit_pack_report.json artifacts/law_tree_case_fruit_pack_report.md artifacts/law_tree_case_fruit_level1_eval.json artifacts/law_tree_case_fruit_level1_eval.md artifacts/law_tree_case_fruit_level2_eval.json artifacts/law_tree_case_fruit_level2_eval.md artifacts/demo_outputs

      - name: Dry-run verified legal model SFT export
        run: node scripts/export_verified_cards_to_sft_dataset.js --dry-run

      - name: Validate teacher candidates
        run: node scripts/validate_teacher_candidates.js

      - name: Dry-run verified teacher SFT bridge
        run: node scripts/build_verified_teacher_sft_dataset.js --dry-run

      - name: Validate legal model training dataset
        run: node scripts/validate_legal_model_training_dataset.js

      - name: Report legal model training dataset
        run: node scripts/report_legal_model_training_dataset.js

      - name: Evaluate legal model outputs offline fixtures
        run: node scripts/evaluate_legal_model_outputs_offline.js --fixtures-only

      - name: Ensure legal model training artifacts are committed
        run: git diff --exit-code data/legal_model_training artifacts/legal_model_training_dataset_report.json artifacts/legal_model_training_dataset_report.md docs/legal_model_training_plan.md docs/teacher_assisted_extraction_policy.md training

      - name: Dry-run Part 1 source-card Qdrant indexer
        run: node scripts/index_part1_two_vertical_source_cards_qdrant.js --dry-run

      - name: Validate answer composers
        run: node scripts/validate_answer_composers.js

      - name: Validate criminal inquiry API
        run: node scripts/validate_criminal_inquiry_api.js

      - name: Validate probate inquiry API
        run: node scripts/validate_probate_inquiry_api.js

      - name: Validate legal domain arbiter
        run: node scripts/validate_legal_domain_arbiter.js

      - name: Validate committed secrets
        run: node scripts/validate_no_secrets_committed.js
